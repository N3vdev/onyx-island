<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Onyx Lens</title>
    <style>
      :root {
        /* The captured screen supplies the content. Chrome stays ink/paper;
           only the hand-drawn lasso carries color. */
        --ink: #080808;
        --paper: #fff;
        --muted-on-dark: #c7c7c7;
        --muted-on-light: #555;
        --hover: rgba(8, 8, 8, 0.16);
        --selection-blue: #0b67b1;
        /* Settings-driven (main.ts's applyTheme); these defaults match the
           app's original hardcoded look exactly, so an unconfigured install
           renders identically to before these existed. */
        --accent: #080808;
        /* Text on the accent, recomputed for contrast whenever it changes. */
        --on-accent: #fff;
        /* Theme surface tokens (Pro visual pack presets override these). */
        --region-border: rgba(255, 255, 255, 0.3);
        --region-fill: rgba(0, 0, 0, 0.16);
        --text-selection: rgba(11, 103, 177, 0.7);
        --hint-border: rgba(255, 255, 255, 0.34);
        --plate-fill: rgba(250, 250, 252, 0.97);
        --plate-ink: #111114;
        --card-radius: 20px;
        --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        /* Floating chrome (tool bar, action bar, hint) wears Onyx's island
           look; overlay-controls.css holds the tokens. */
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        cursor: crosshair;
        font-family: "Inter Variable", "Segoe UI Variable", "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.001ms !important;
          transition-duration: 0.001ms !important;
        }
      }

      /* The frozen capture and the Siri-style edge light share this stage. */
      #overlay-scene {
        position: absolute;
        inset: 0;
      }

      /* Edge light covers the capture, but stays below controls (layer 10)
         and feedback (layer 11). It never intercepts input. */
      #opening-prism {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 9;
        pointer-events: none;
      }

      #frame,
      #spotlight,
      #lasso,
      #debug {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #frame {
        z-index: 1;
      }

      /* Dim backdrop with a reveal matching the active selection geometry. */
      #spotlight {
        z-index: 2;
        opacity: 0;
        pointer-events: none;
        transition: opacity 160ms var(--ease-out-expo);
      }

      #spotlight.visible {
        opacity: 1;
      }

      #overlay-scene:has(#opening-prism.glow-active) #spotlight {
        transition-duration: 620ms;
      }

      #lasso {
        z-index: 3;
        touch-action: none;
      }

      #debug {
        z-index: 4;
        pointer-events: none;
      }

      /* Sized/positioned in frame-pixel units by textselection.ts, then scaled
         down as a whole via a CSS transform so line boxes stay pixel-exact
         at any monitor DPI — the same trick the canvases get for free from
         their device-pixel backing store + 100% CSS size. */
      #text-layer {
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: 0 0;
        z-index: 6;
        /* Only the selected card catches input; outside it, another drag
           still starts a new lasso. */
        pointer-events: none;
      }

      /* Translate in place. Same frame-pixel layout + scale trick as
         #text-layer; drawn above it and click-through, so the original text
         underneath stays selectable and Esc/click-away behave as before. */
      #translate-layer {
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: 0 0;
        z-index: 6;
        pointer-events: none;
      }

      #translate-layer[hidden] {
        display: none;
      }

      /* Redact (Pro). Same frame-pixel layout + scale trick as #text-layer,
         but stacked above #translate-layer — a redacted box must stay on
         top no matter what else is shown, since covering the sensitive
         text is the entire point. */
      #redact-layer {
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: 0 0;
        z-index: 7;
        pointer-events: none;
      }

      #redact-layer[hidden] {
        display: none;
      }

      .redact-box {
        position: absolute;
        box-sizing: border-box;
        background: #0b0b0f;
        border-radius: 3px;
      }

      /* Designer toolkit (Pro): eyedropper + ruler. Same frame-pixel layout
         + scale trick as the other overlays, stacked above all of them —
         it's an active tool, drawn while the user is using it. */
      #designer-layer {
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: 0 0;
        z-index: 8;
        pointer-events: none;
      }

      #designer-layer[hidden] {
        display: none;
      }

      #brush-layer {
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: 0 0;
        z-index: 8;
        pointer-events: none;
      }

      #brush-layer[hidden] {
        display: none;
      }

      #tool-brush-erase[hidden] { display: none; }

      #designer-readout {
        position: fixed;
        z-index: var(--overlay-feedback-layer);
        padding: 6px 12px;
        border-radius: 999px;
        background: var(--bar-bg);
        border: 1px solid var(--bar-border);
        color: var(--bar-text);
        font: 500 12px/1.2 var(--bar-font);
        white-space: nowrap;
        pointer-events: none;
      }

      #designer-readout[hidden] {
        display: none;
      }

      #designer-readout .swatch {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 3px;
        margin-right: 6px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        vertical-align: -1px;
      }

      .translate-plate {
        position: absolute;
        box-sizing: border-box;
        overflow-wrap: anywhere;
        hyphens: auto;
        border-radius: 8px;
        background: var(--plate-fill);
        color: var(--plate-ink);
        box-shadow: 0 6px 18px -8px rgba(0, 0, 0, 0.45);
        font-family: "Inter Variable", "Segoe UI Variable", "Segoe UI", sans-serif;
        font-weight: 500;
        line-height: 1.22;
        animation: plate-in 200ms var(--ease-out-expo) both;
      }

      @keyframes plate-in {
        from { opacity: 0; transform: translateY(2px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* One full hit surface, including whitespace between OCR blocks. */
      .ocr-selection-card {
        position: absolute;
        pointer-events: auto;
        cursor: text;
        user-select: text;
        border-radius: var(--card-radius);
        overflow: hidden;
      }

      /* One OCR block is one low-opacity visual paragraph. This is
         deliberately not a card per line: dragging across a paragraph stays
         one calm surface while the source pixels remain clearly visible. */
      .ocr-region {
        position: absolute;
        box-sizing: border-box;
        cursor: text;
        border: 1px solid var(--region-border);
        border-radius: 10px;
        background: var(--region-fill);
        box-shadow: 0 10px 22px -20px rgba(0, 0, 0, 0.55);
        animation: paragraph-in 190ms var(--ease-out-expo) both;
      }

      @keyframes paragraph-in {
        from { opacity: 0; transform: translateY(3px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .ocr-line {
        position: absolute;
        /* The underlying screenshot is the visible type. This DOM text is
           only its exact selectable hit map, preventing font substitutions
           or OCR metrics from changing what the person sees. */
        color: transparent;
        -webkit-text-fill-color: transparent;
        cursor: text;
        user-select: text;
        white-space: pre;
        transform-origin: left center;
        font-family: "Inter Variable", "Segoe UI Variable", "Segoe UI", sans-serif;
        font-weight: 500;
        letter-spacing: 0;
        text-rendering: geometricPrecision;
      }

      /* Live text: screen-wide, invisible until selected. Only the lines
         catch the pointer (an I-beam says "this is text"); everything else
         falls through to the lasso. Alt (or a designer tool) turns them off
         so a lasso can be drawn over text too. */
      .ocr-screen { position: absolute; inset: 0; pointer-events: none; }
      .ocr-screen .ocr-region {
        pointer-events: none;
        border: 0;
        background: none;
        box-shadow: none;
        animation: none;
      }
      .ocr-screen .ocr-line { pointer-events: auto; }
      body.draw-over-text .ocr-screen .ocr-line { pointer-events: none; }

      /* QR code chips. */
      #code-chips {
        position: absolute;
        inset: 0;
        z-index: var(--overlay-controls-layer);
        pointer-events: none;
      }

      #code-chips[hidden] { display: none; }

      .code-ring {
        position: absolute;
        border: 2px solid var(--bar-accent);
        border-radius: 10px;
        box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.25);
        animation: chip-in 260ms var(--ease-out-expo) both;
      }

      .code-chip {
        position: absolute;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        max-width: 280px;
        height: 32px;
        padding: 0 13px 0 10px;
        border: 1px solid var(--bar-border);
        border-radius: 999px;
        background: var(--bar-bg);
        color: var(--bar-text);
        box-shadow: var(--bar-shadow);
        font: 500 12px/1 var(--bar-font);
        white-space: nowrap;
        cursor: pointer;
        pointer-events: auto;
        animation: chip-in 280ms var(--ease-out-expo) 60ms both;
        transition: background-color 140ms var(--ease-out-expo), transform 90ms var(--ease-out-expo);
      }

      .code-chip:hover { background: #1d1d20; }
      .code-chip:active { transform: scale(0.96); }
      .code-chip .action-label { overflow: hidden; text-overflow: ellipsis; }

      @keyframes chip-in {
        from { opacity: 0; transform: translateY(4px) scale(0.97); }
        to { opacity: 1; transform: none; }
      }

      /* Native range paint appears above the source pixels; its transparency
         keeps the original glyphs readable at their real size. */
      .ocr-line::selection {
        background: var(--text-selection);
        color: transparent;
        -webkit-text-fill-color: transparent;
      }

      /* Shown instead of a frame when the capture came back blank. */
      #message {
        position: absolute;
        z-index: var(--overlay-feedback-layer);
        pointer-events: none;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: max-content;
        max-width: min(420px, calc(100vw - 64px));
        padding: 22px 26px;
        background: var(--bar-bg);
        border: 1px solid var(--bar-border);
        border-radius: 30px;
        box-shadow: var(--bar-shadow);
        color: var(--bar-text);
        font-family: var(--bar-font);
        font-size: 15px;
        font-weight: 600;
        line-height: 1.45;
        text-align: center;
        cursor: default;
        /* Its own keyframes rather than the action bar's: this element is
           centred with a translate, and sharing that animation would drop
           the centring for the duration of it. */
        animation: message-in 180ms var(--ease-out-expo);
      }

      @keyframes message-in {
        from {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
      }

      #message[hidden] {
        display: none;
      }

      #message .hint {
        display: block;
        margin-top: 8px;
        color: var(--bar-muted);
        font-size: 13px;
        font-weight: 500;
      }

      #hint {
        position: absolute;
        z-index: var(--overlay-feedback-layer);
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        max-width: calc(100vw - 32px);
        padding: 9px 16px;
        border: 1px solid var(--bar-border);
        border-radius: 999px;
        background: var(--bar-bg);
        color: var(--bar-text);
        box-shadow: var(--bar-shadow);
        font-family: var(--bar-font);
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.005em;
        pointer-events: none;
        white-space: nowrap;
        animation: hint-in 230ms var(--ease-out-expo) both;
      }

      #hint[hidden] { display: none; }

      #hint.has-action { pointer-events: auto; }

      #hint .hint-action {
        margin: -4px -9px -4px 14px;
        padding: 5px 12px;
        border: 0;
        border-radius: 999px;
        background: var(--bar-primary);
        color: var(--bar-text);
        font: inherit;
        cursor: pointer;
        transition: filter 140ms var(--ease-out-expo), transform 90ms var(--ease-out-expo);
      }

      #hint .hint-action:hover { filter: brightness(1.08); }
      #hint .hint-action:active { transform: scale(0.96); }

      #hint .hint-action[hidden] { display: none; }

      #hint .hint-shortcut {
        margin-left: 12px;
        color: var(--bar-muted);
        font-weight: 500;
      }

      @keyframes hint-in {
        from { opacity: 0; transform: translate(-50%, 7px); }
        to { opacity: 1; transform: translate(-50%, 0); }
      }

    </style>
    <link rel="stylesheet" href="/src/overlay-controls.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="overlay-scene">
      <canvas id="frame"></canvas>
      <canvas id="spotlight"></canvas>
      <canvas id="lasso"></canvas>
      <canvas id="debug"></canvas>
      <canvas id="opening-prism" aria-hidden="true"></canvas>
      <button id="overlay-close" class="capture-control" type="button" aria-label="Close screenshot" title="Close screenshot (Esc)" hidden>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 4 8 8m0-8-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
      </button>
      <div id="text-layer"></div>
      <div id="translate-layer" hidden></div>
      <div id="redact-layer" hidden></div>
      <div id="tool-bar" class="capture-controls" role="group" aria-label="Selection tool" hidden>
        <button id="tool-lasso" type="button" aria-pressed="true" title="Draw a freehand selection, or swipe straight across something to select it">Lasso</button>
        <button id="tool-rectangle" type="button" aria-pressed="false" title="Drag a rounded rectangle">Rectangle</button>
        <button id="tool-full-screen" type="button" title="Select the whole screen">Full screen</button>
        <span id="tool-bar-divider" aria-hidden="true" hidden></span>
        <button id="tool-eyedropper" type="button" aria-pressed="false" hidden>Eyedropper</button>
        <button id="tool-measure" type="button" aria-pressed="false" hidden>Measure</button>
        <button id="tool-edit" type="button" aria-pressed="false" hidden title="Draw loosely around something and the outline snaps to its edges, leaving a cut-out with no background">Snap</button>
        <button id="tool-brush" type="button" aria-pressed="false" hidden title="Paint over the selection to add to it. Hold Alt, or use Erase, to take away. [ and ] change the size.">Brush</button>
        <button id="tool-brush-erase" type="button" aria-pressed="false" hidden title="Paint to remove from the selection">Erase</button>
      </div>
      <canvas id="designer-layer" hidden></canvas>
      <canvas id="brush-layer" hidden></canvas>
      <div id="designer-readout" hidden></div>
      <div id="code-chips" hidden></div>
      <div id="action-bar" class="capture-controls" hidden></div>
      <div id="hint" hidden><span class="hint-label">Draw around text or an image</span><span class="hint-shortcut">Esc to close</span><button class="hint-action" type="button" hidden></button></div>
      <div id="message" hidden></div>
    </div>
  </body>
</html>
