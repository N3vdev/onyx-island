<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Onyx Lens Pin</title>
    <link rel="stylesheet" href="/src/pin.css" />
    <script type="module" src="/src/pin.ts" defer></script>
  </head>

  <body>
    <!-- "deep" makes every descendant a drag handle, holding the pin
         anywhere (the image included) moves it. The close button is exempt
         automatically (real buttons block drag unless they opt in
         themselves) and the resize grip cancels the drag itself by calling
         preventDefault on its own pointerdown, per Tauri's drag.js. -->
    <div id="pin-frame" data-tauri-drag-region="deep">
      <div id="pin-handle">
        <button id="pin-close" type="button" aria-label="Close pin" title="Close">
          <svg viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" /></svg>
        </button>
      </div>
      <img id="pin-image" alt="Pinned selection" draggable="false" />
      <div id="pin-resize-grip" title="Drag to resize"></div>
    </div>
  </body>
</html>
