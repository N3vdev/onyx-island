[package]
name = "islet-asr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Everything the island process needs to use speech recognition: the model
# registry, the model downloader, and the client for `islet-asr-worker.exe`.
# No ONNX Runtime is linked here; it lives in the worker (see PROGRESS.md).
[dependencies]
islet-core = { path = "../islet-core" }
crossbeam-channel.workspace = true
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
tracing.workspace = true
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
hound = "3.5"

[[example]]
name = "dictate_wav"
path = "examples/dictate_wav.rs"
